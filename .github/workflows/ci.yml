name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Workspace & Claims Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check workspace compilation
        run: cargo check --workspace --all-targets

      - name: Run all workspace tests (330+ tests across 10 crates)
        run: cargo test --workspace

      - name: Verify Claims Registry integrity
        run: python scripts/verify_claims.py

      - name: Test Crucible CLI Campaign & Upstream Packaging
        run: cargo run -p crucible-cli -- campaign --seed 1337

      - name: Test Standalone Cryptographic Verifier (CLM-004)
        run: cargo run -p crucible-cli -- verify --bundle CRUCIBLE-BUG-2026-001.json --replay

      - name: Test Multi-Run Determinism Auditor
        run: cargo run -p crucible-cli -- audit --runs 25 --seed 42
