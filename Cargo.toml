[workspace]
resolver = "2"
members = [
    "crates/crucible-core",
    "crates/crucible-vkernel",
    "crates/crucible-emu",
    "crates/crucible-checkers",
    "crates/crucible-trace",
    "crates/crucible-cli",
    "crates/crucible-sim",
    "crates/crucible-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Crucible Authors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/crucible-testing/crucible"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
rand_chacha = "0.3"
bytes = "1.10"
tokio = { version = "1.43", features = ["full"] } # Only for CLI / orchestrator control plane, never in deterministic sim
clap = { version = "4.5", features = ["derive"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "gas", "intel"] }
object = { version = "0.36", default-features = false, features = ["read_core", "elf"] }
